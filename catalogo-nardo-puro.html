<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nardo Puro — Catálogo de fragancias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110D08;
  --surface:#1C150D;
  --surface-2:#251C12;
  --line:rgba(198,160,82,0.20);
  --gold:#C6A052;
  --gold-soft:#E7D2A0;
  --ivory:#F4EEE1;
  --stone:#A0937C;
  --rose:#C98C86;
  --bronze:#9C7F52;
  --steel:#7C93A8;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  background-image:radial-gradient(circle at 50% 0%, #201709 0%, #110D08 55%);
  color:var(--ivory);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
}

a{color:inherit;}

/* ---------- Hero ---------- */
.hero{
  text-align:center;
  padding:60px 24px 30px;
}
.mark{display:flex;justify-content:center;margin-bottom:14px;}
.mark img{width:38px;height:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.35));}
.hero h1{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:600;
  font-size:clamp(2.1rem,7vw,3.1rem);
  margin:0 0 8px;
  letter-spacing:0.01em;
}
.tagline{
  font-family:'Playfair Display',Georgia,serif;
  font-style:italic;
  color:var(--gold-soft);
  font-size:1.05rem;
  margin:0 0 16px;
}
.intro{
  color:var(--stone);
  font-size:0.95rem;
  line-height:1.6;
  max-width:420px;
  margin:0 auto;
}

/* ---------- Controls ---------- */
.controls{
  max-width:860px;
  margin:0 auto;
  padding:0 20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.search-wrap input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px 16px;
  color:var(--ivory);
  font-family:'Inter',sans-serif;
  font-size:0.95rem;
}
.search-wrap input::placeholder{color:var(--stone);}
.search-wrap input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

.filters-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
}
.pills{display:flex;gap:8px;flex-wrap:wrap;}
.pill{
  background:transparent;
  border:1px solid var(--line);
  color:var(--stone);
  padding:8px 16px;
  border-radius:999px;
  font-family:'Inter',sans-serif;
  font-size:0.85rem;
  cursor:pointer;
  transition:border-color .2s ease,color .2s ease,background .2s ease;
}
.pill:hover{border-color:var(--gold);color:var(--gold-soft);}
.pill.active{background:rgba(198,160,82,0.14);border-color:var(--gold);color:var(--gold-soft);}
.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

select#marcaSelect{
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--ivory);
  padding:10px 14px;
  border-radius:12px;
  font-family:'Inter',sans-serif;
  font-size:0.85rem;
  max-width:220px;
}
select#marcaSelect:focus-visible{outline:2px solid var(--gold);}

/* ---------- Aroma finder ---------- */
.aroma-section{
  max-width:1100px;
  margin:8px auto 28px;
  padding:0 24px;
  text-align:center;
}
.aroma-title{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:600;
  font-size:clamp(1.3rem,3.2vw,1.7rem);
  color:var(--ivory);
  margin:0 0 6px;
}
.aroma-subtitle{
  color:var(--stone);
  font-size:0.88rem;
  margin:0 0 20px;
}
.aroma-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  gap:10px;
  max-width:920px;
  margin:0 auto;
}
.aroma-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 8px 12px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  transition:border-color .2s ease,background .2s ease,transform .2s ease;
  font-family:'Inter',sans-serif;
}
.aroma-card:hover{border-color:var(--gold);transform:translateY(-2px);}
.aroma-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.aroma-card .aroma-emoji{font-size:1.6rem;line-height:1;}
.aroma-card .aroma-label{
  font-size:0.72rem;
  letter-spacing:0.02em;
  color:var(--stone);
  font-weight:600;
  text-transform:uppercase;
}
.aroma-card.active{
  background:rgba(198,160,82,0.16);
  border-color:var(--gold);
}
.aroma-card.active .aroma-label{color:var(--gold-soft);}
.aroma-clear{
  margin-top:18px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--stone);
  padding:8px 18px;
  border-radius:999px;
  font-family:'Inter',sans-serif;
  font-size:0.8rem;
  cursor:pointer;
  transition:border-color .2s ease,color .2s ease;
}
.aroma-clear:hover{border-color:var(--gold);color:var(--gold-soft);}
.aroma-clear[hidden]{display:none;}

.counter{
  text-align:center;
  color:var(--stone);
  font-size:0.82rem;
  margin:22px 0 18px;
}

/* ---------- Grid ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:14px;
  max-width:1400px;
  margin:0 auto;
  padding:0 20px 40px;
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  padding:0;
  text-align:left;
  display:flex;
  flex-direction:column;
  color:inherit;
  opacity:0;
  transform:translateY(14px) scale(0.98);
  animation:cardIn .6s ease forwards;
  transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease;
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px);
  box-shadow:0 18px 36px -18px rgba(0,0,0,0.6);
  border-color:var(--gold);
  outline:none;
}
.card.hidden{display:none;}
@keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1);}}

.card-frame{
  position:relative;
  aspect-ratio:941/1672;
  overflow:hidden;
  background:var(--surface-2);
}
.card-frame img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .5s ease;
  opacity:0;
}
.card-frame img.loaded{opacity:1;}
.card:hover .card-frame img{transform:scale(1.045);}

.card-caption{padding:11px 13px 13px;display:flex;flex-direction:column;gap:4px;}
.card-nombre{font-family:'Playfair Display',Georgia,serif;font-size:0.98rem;line-height:1.28;color:var(--ivory);}
.card-marca{font-size:0.76rem;color:var(--stone);}
.card-tag{
  align-self:flex-start;
  margin-top:4px;
  font-size:0.66rem;
  letter-spacing:0.03em;
  padding:3px 9px;
  border-radius:999px;
  color:#1a1206;
  font-weight:600;
}
.tag-mujeres{background:var(--rose);}
.tag-hombres{background:var(--steel);}
.tag-unisex{background:var(--bronze);}

/* ---------- Empty state ---------- */
.empty{
  text-align:center;
  color:var(--stone);
  padding:50px 20px;
  font-family:'Playfair Display',Georgia,serif;
  font-style:italic;
  font-size:1.05rem;
}
.empty button{
  display:block;
  margin:16px auto 0;
  background:transparent;
  border:1px solid var(--line);
  color:var(--gold-soft);
  padding:8px 18px;
  border-radius:999px;
  font-family:'Inter',sans-serif;
  font-style:normal;
  font-size:0.82rem;
  cursor:pointer;
}
.empty button:hover{border-color:var(--gold);}

/* ---------- Footer ---------- */
footer{
  text-align:center;
  color:var(--stone);
  font-size:0.76rem;
  line-height:1.7;
  padding:36px 24px 60px;
  max-width:560px;
  margin:20px auto 0;
  border-top:1px solid var(--line);
}

/* ---------- Lightbox ---------- */
.lightbox{
  position:fixed;inset:0;
  background:rgba(8,6,3,0.94);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
  animation:fadeIn .25s ease;
}
.lightbox[hidden]{display:none;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.lb-content{
  max-width:480px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;align-items:center;
  animation:scaleIn .3s ease;
}
@keyframes scaleIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}

#lbImg{max-width:100%;max-height:66vh;border-radius:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);object-fit:contain;}

.lb-caption{text-align:center;margin-top:16px;padding:0 40px;}
.lb-caption h2{font-family:'Playfair Display',Georgia,serif;color:var(--ivory);font-size:1.25rem;margin:0 0 4px;font-weight:600;}
.lb-caption p{color:var(--stone);font-size:0.85rem;margin:0;}
.lb-caption .card-tag{margin-top:8px;}
.lb-position{color:var(--stone);font-size:0.74rem;margin-top:12px;letter-spacing:0.04em;}

.lb-close,.lb-prev,.lb-next{
  position:absolute;
  background:rgba(255,255,255,0.07);
  border:1px solid var(--line);
  color:var(--ivory);
  width:42px;height:42px;
  border-radius:50%;
  font-size:1.3rem;
  line-height:1;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .2s ease,background .2s ease;
}
.lb-close:hover,.lb-prev:hover,.lb-next:hover{border-color:var(--gold);background:rgba(198,160,82,0.14);}
.lb-close{top:18px;right:18px;}
.lb-prev{left:14px;top:50%;transform:translateY(-50%);}
.lb-next{right:14px;top:50%;transform:translateY(-50%);}
@media (max-width:560px){.lb-prev{left:4px;}.lb-next{right:4px;}.lb-close{top:10px;right:10px;}}

/* ---------- Accessibility ---------- */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}
}

</style>
</head>

  </div>
</div>

const MARCAS = ["Afnan", "Ahli", "Al Haramain Perfumes", "Antonio Banderas", "Ariana Grande", "Armaf", "Bharara", "Bond No. 9", "Britney Spears", "Burberry", "Bvlgari", "Calvin Klein", "Carolina Herrera", "Chanel", "Creed", "Diesel", "Dior", "Dolce & Gabbana", "Donna Karan", "Ferrari", "Giorgio Armani", "Givenchy", "Halloween", "Hugo Boss", "ILMIN Parfums", "Issey Miyake", "Jean Pascal", "Jean Paul Gaultier", "Katy Perry", "Lacoste", "Lancôme", "Lattafa Perfumes", "Le Labo", "Louis Vuitton", "Maison Francis Kurkdjian", "Montale", "Montblanc", "Moschino", "Nautica", "Orientica Premium", "Parfums de Marly", "Paris Hilton", "Perry Ellis", "Rabanne", "Ralph Lauren", "Rasasi", "Ted Lapidus", "Tom Ford", "Tommy Hilfiger", "Valentino", "Versace", "Victoria's Secret", "Victorinox Swiss Army", "Xerjoff", "Yanbal", "Yves Saint Laurent"];

const grid = document.getElementById('grid');
const counterEl = document.getElementById('counter');
const emptyState = document.getElementById('emptyState');
const searchInput = document.getElementById('search');
const marcaSelect = document.getElementById('marcaSelect');
const genderPills = Array.from(document.querySelectorAll('.pill'));
const clearBtn = document.getElementById('clearFilters');

let currentGenero = 'Todas';
let currentMarca = 'Todas';
let currentSearch = '';
let filtered = DATA.slice();

function normalize(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Poblar el selector de marcas
MARCAS.forEach(m=>{
  const opt = document.createElement('option');
  opt.value = m;
  opt.textContent = m;
  marcaSelect.appendChild(opt);
});

// ---------- Filtro "¿Qué tipo de aroma buscas?" ----------
const AROMA_CATS = [
  {id:'DULCE', emoji:'🍯', label:'Dulce'},
  {id:'FRESCO', emoji:'🌊', label:'Fresco'},
  {id:'CITRICO', emoji:'🍋', label:'Cítrico'},
  {id:'FLORAL', emoji:'🌸', label:'Floral'},
  {id:'AFRUTADO', emoji:'🍎', label:'Afrutado'},
  {id:'AMADERADO', emoji:'🪵', label:'Amaderado'},
  {id:'ESPECIADO', emoji:'🌶️', label:'Especiado'},
  {id:'GOURMAND', emoji:'☕', label:'Gourmand'},
  {id:'CALIDO_AMBARADO', emoji:'🧡', label:'Cálido / Ambarado'},
  {id:'AROMATICO', emoji:'🌿', label:'Aromático'},
  {id:'ATALCADO', emoji:'🧴', label:'Atalcado'},
  {id:'VERDE_NATURAL', emoji:'🌱', label:'Verde / Natural'},
];
const selectedAromas = new Set();
const aromaGrid = document.getElementById('aromaGrid');
const aromaClearBtn = document.getElementById('aromaClear');
const aromaCardEls = new Map();

AROMA_CATS.forEach(cat=>{
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'aroma-card';
  btn.setAttribute('aria-pressed','false');
  btn.innerHTML = '<span class="aroma-emoji">'+cat.emoji+'</span><span class="aroma-label">'+cat.label+'</span>';
  btn.addEventListener('click', ()=>{
    if(selectedAromas.has(cat.id)){
      selectedAromas.delete(cat.id);
      btn.classList.remove('active');
      btn.setAttribute('aria-pressed','false');
    } else {
      selectedAromas.add(cat.id);
      btn.classList.add('active');
      btn.setAttribute('aria-pressed','true');
    }
    updateAromaClearVisibility();
    applyFilters();
  });
  aromaGrid.appendChild(btn);
  aromaCardEls.set(cat.id, btn);
});

function updateAromaClearVisibility(){
  aromaClearBtn.hidden = selectedAromas.size === 0;
}
updateAromaClearVisibility();

aromaClearBtn.addEventListener('click', ()=>{
  selectedAromas.clear();
  aromaCardEls.forEach(btn=>{ btn.classList.remove('active'); btn.setAttribute('aria-pressed','false'); });
  updateAromaClearVisibility();
  applyFilters();
});

// Carga diferida de imágenes (IntersectionObserver)
const lazyObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      const img = entry.target;
      if(img.dataset.src){
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      }
      img.addEventListener('load', ()=>img.classList.add('loaded'), {once:true});
      lazyObserver.unobserve(img);
    }
  });
},{rootMargin:'500px 0px'});

// Construir tarjetas una sola vez
const cardEls = new Map();
DATA.forEach((p, idx)=>{
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card';
  card.dataset.id = p.id;
  card.style.animationDelay = Math.min(idx*10,480)+'ms';
  card.setAttribute('aria-label','Ver '+p.nombre);

  const genEtiqueta = (p.genero === 'Mujeres' ? 'Para mujeres' : p.genero === 'Hombres' ? 'Para hombres' : 'Unisex') + (p.cod ? ' '+p.cod : '');
  const genClase = p.genero === 'Mujeres' ? 'tag-mujeres' : p.genero === 'Hombres' ? 'tag-hombres' : 'tag-unisex';

  card.innerHTML =
    '<span class="card-frame"><img data-src="'+p.img+'" alt="'+escapeHtml(p.nombre)+'" decoding="async"/></span>'+
    '<span class="card-caption">'+
      '<span class="card-nombre">'+escapeHtml(p.nombre)+'</span>'+
      (p.marca ? '<span class="card-marca">'+escapeHtml(p.marca)+'</span>' : '')+
      '<span class="card-tag '+genClase+'">'+genEtiqueta+'</span>'+
    '</span>';

  card.addEventListener('click', ()=>openLightbox(p.id));
  grid.appendChild(card);
  cardEls.set(p.id, card);
  lazyObserver.observe(card.querySelector('img'));
});

function applyFilters(){
  const q = normalize(currentSearch.trim());
  filtered = DATA.filter(p=>{
    if(currentGenero !== 'Todas' && p.genero !== currentGenero) return false;
    if(currentMarca !== 'Todas' && p.marca !== currentMarca) return false;
    if(selectedAromas.size){
      const cats = p.categorias || [];
      for(const need of selectedAromas){
        if(!cats.includes(need)) return false;
      }
    }
    if(q){
      const hay = normalize(p.nombre+' '+p.marca+' '+(p.cod||''));
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const visibleIds = new Set(filtered.map(p=>p.id));
  cardEls.forEach((card, id)=>{
    card.classList.toggle('hidden', !visibleIds.has(id));
  });
  counterEl.textContent = 'Mostrando '+filtered.length+' de '+DATA.length+' fragancias';
  emptyState.hidden = filtered.length !== 0;
}

searchInput.addEventListener('input', e=>{ currentSearch = e.target.value; applyFilters(); });
marcaSelect.addEventListener('change', e=>{ currentMarca = e.target.value; applyFilters(); });
genderPills.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    genderPills.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentGenero = btn.dataset.genero;
    applyFilters();
  });
});
if(clearBtn){
  clearBtn.addEventListener('click', ()=>{
    currentSearch=''; currentMarca='Todas'; currentGenero='Todas';
    searchInput.value=''; marcaSelect.value='Todas';
    genderPills.forEach(b=>b.classList.toggle('active', b.dataset.genero==='Todas'));
    selectedAromas.clear();
    aromaCardEls.forEach(btn=>{ btn.classList.remove('active'); btn.setAttribute('aria-pressed','false'); });
    updateAromaClearVisibility();
    applyFilters();
  });
}

/* ---------- Lightbox ---------- */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbNombre = document.getElementById('lbNombre');
const lbMarca = document.getElementById('lbMarca');
const lbGenero = document.getElementById('lbGenero');
const lbPosition = document.getElementById('lbPosition');
let lbIndex = -1;

function openLightbox(id){
  lbIndex = filtered.findIndex(p=>p.id===id);
  if(lbIndex===-1) lbIndex = 0;
  renderLightbox();
  lightbox.hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  lightbox.hidden = true;
  document.body.style.overflow = '';
}
function renderLightbox(){
  const p = filtered[lbIndex];
  if(!p) return;
  lbImg.src = p.img;
  lbImg.alt = p.nombre;
  lbNombre.textContent = p.nombre;
  if(p.marca){ lbMarca.textContent = p.marca; lbMarca.hidden = false; } else { lbMarca.hidden = true; }
  const genEtiqueta = (p.genero === 'Mujeres' ? 'Para mujeres' : p.genero === 'Hombres' ? 'Para hombres' : 'Unisex') + (p.cod ? ' '+p.cod : '');
  const genClase = p.genero === 'Mujeres' ? 'tag-mujeres' : p.genero === 'Hombres' ? 'tag-hombres' : 'tag-unisex';
  lbGenero.textContent = genEtiqueta;
  lbGenero.className = 'card-tag '+genClase;
  lbPosition.textContent = (lbIndex+1)+' / '+filtered.length;
}
function nextLb(){ if(!filtered.length) return; lbIndex = (lbIndex+1) % filtered.length; renderLightbox(); }
function prevLb(){ if(!filtered.length) return; lbIndex = (lbIndex-1+filtered.length) % filtered.length; renderLightbox(); }

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbNext').addEventListener('click', nextLb);
document.getElementById('lbPrev').addEventListener('click', prevLb);
lightbox.addEventListener('click', e=>{ if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e=>{
  if(lightbox.hidden) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowRight') nextLb();
  if(e.key === 'ArrowLeft') prevLb();
});

let touchStartX = 0;
lightbox.addEventListener('touchstart', e=>{ touchStartX = e.changedTouches[0].clientX; }, {passive:true});
lightbox.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){ dx > 0 ? prevLb() : nextLb(); }
}, {passive:true});

applyFilters();

</script>
